const SEED = [{"id":"s01","n":6,"dif":"difícil","p":"Lactante de 11 meses con fiebre de 39,8 °C durante 3 días, sin foco aparente y en buen estado general. Al cuarto día la fiebre desaparece bruscamente y aparece un exantema maculopapular rosado en el tronco, no pruriginoso. ¿Cuál es el agente más probable?","o":["Virus del sarampión","Parvovirus B19","Herpesvirus humano tipo 6","Virus de la rubéola","Streptococcus pyogenes"],"c":2,"ex":"Exantema súbito (roséola, 6.ª enfermedad): típico de 6 a 24 meses, fiebre alta de 3 a 5 días sin foco y el exantema aparece cuando la fiebre cae. Lo causa el HHV-6 (menos el HHV-7). Puede producir convulsión febril.","d":["En el sarampión el exantema aparece en el pico febril (tras 3-4 días de pródromo catarral con manchas de Koplik), es cefalocaudal y confluente; la fiebre no cae al aparecer.","El parvovirus B19 da eritema infeccioso en escolares: 'mejillas abofeteadas' y exantema reticulado en encaje; fiebre escasa o ausente.","","La rubéola cursa con fiebre baja simultánea al exantema y adenopatías retroauriculares y occipitales.","S. pyogenes produce escarlatina (generalmente > 3 años): faringitis, exantema áspero 'en papel de lija', lengua aframbuesada y líneas de Pastia, con fiebre presente."],"nem":"Orden clásico de las enfermedades exantemáticas: 1.ª sarampión, 2.ª escarlatina, 3.ª rubéola, 4.ª enfermedad de Filatov-Dukes, 5.ª eritema infeccioso (parvovirus B19), 6.ª exantema súbito (HHV-6).","perla":"Exantemas con fiebre mínima o ausente: eritema infeccioso y rubéola. El exantema súbito es el único en que el exantema sigue a la defervescencia."},{"id":"s02","n":6,"dif":"intermedia","p":"Preescolar de 3 años, no vacunado, con 4 días de fiebre alta, tos, coriza y conjuntivitis. Hoy presenta exantema maculopapular que empezó detrás de las orejas y desciende al tronco. Además del manejo sintomático y el aislamiento, ¿qué medida específica reduce la morbimortalidad?","o":["Aciclovir oral","Vitamina A","Inmunoglobulina endovenosa","Amoxicilina profiláctica","Corticoide sistémico"],"c":1,"ex":"Es sarampión. La OMS recomienda vitamina A (2 dosis en días consecutivos) a todo niño con sarampión: disminuye complicaciones (neumonía, ceguera) y mortalidad.","d":["El aciclovir se usa en varicela en grupos de riesgo; el sarampión no tiene antiviral específico de uso rutinario.","","La inmunoglobulina se usa como profilaxis posexposición en contactos susceptibles (dentro de 6 días), no como tratamiento del enfermo. La IGIV en alta dosis es tratamiento de Kawasaki.","Los antibióticos solo se indican si hay sobreinfección bacteriana (otitis, neumonía).","Los corticoides no están indicados en el sarampión no complicado."],"nem":null,"perla":"Complicación más frecuente del sarampión: otitis media; causa más frecuente de muerte: neumonía. Complicación tardía: panencefalitis esclerosante subaguda."},{"id":"s03","n":9,"dif":"difícil","p":"Un médico de familia decide no solicitar una tomografía cerebral a un paciente de 30 años con cefalea tensional típica sin signos de alarma. Le explica que el estudio no aporta beneficio y lo expone a radiación y a hallazgos incidentales. ¿Qué nivel de prevención aplica?","o":["Prevención primaria","Prevención secundaria","Prevención terciaria","Prevención cuaternaria","Prevención primordial"],"c":3,"ex":"Prevención cuaternaria (Jamoulle): identificar al paciente en riesgo de sobremedicalización y protegerlo de intervenciones innecesarias o dañinas.","d":["La primaria actúa antes de la enfermedad (periodo prepatogénico): promoción y protección específica, como vacunas o quimioprofilaxis.","La secundaria busca diagnóstico precoz y tratamiento oportuno (tamizaje, Papanicolaou, mamografía).","La terciaria rehabilita y reduce secuelas de una enfermedad ya establecida.","","La primordial evita que aparezcan los factores de riesgo en la población (políticas, entornos saludables)."],"nem":null,"perla":"En Leavell y Clark la 'limitación del daño o de la incapacidad' pertenece a la prevención secundaria, no a la terciaria. Es un distractor frecuente."},{"id":"s04","n":28,"dif":"intermedia","p":"¿Cuál de los siguientes hallazgos obliga a considerar patológica la ictericia de un recién nacido a término?","o":["Aparición a las 60 horas de vida","Pico de bilirrubina al 4.º día de vida","Aparición en las primeras 24 horas de vida","Desaparición al 7.º día de vida","Incremento de la bilirrubina total de 3 mg/dL en 24 horas"],"c":2,"ex":"La ictericia que aparece en las primeras 24 horas es patológica hasta demostrar lo contrario; obliga a pensar en hemólisis (incompatibilidad ABO o Rh).","d":["La ictericia fisiológica aparece típicamente después de las 24 horas, entre el 2.º y 3.er día.","En el RN a término el pico fisiológico ocurre entre el 3.er y 5.º día.","","Que desaparezca en la primera semana es lo esperado en la fisiológica; es patológica la persistencia > 2 semanas en el término.","Se considera patológico un aumento > 5 mg/dL por día (o > 0,2-0,5 mg/dL por hora); 3 mg/dL no alcanza ese umbral."],"nem":null,"perla":"Otros criterios de ictericia patológica: bilirrubina directa elevada (> 1-2 mg/dL o > 20 % de la total), bilirrubina total sobre el percentil 95 para las horas de vida y persistencia > 2 semanas."},{"id":"s05","n":28,"dif":"intermedia","p":"RN a término de 4 días con ictericia que se extiende desde la cabeza hasta los muslos y las rodillas, sin compromiso de piernas, palmas ni plantas. Según la escala de Kramer, ¿qué nivel aproximado de bilirrubina sérica se estima?","o":["Aproximadamente 6 mg/dL","Aproximadamente 9 mg/dL","Aproximadamente 12 mg/dL","Aproximadamente 15 mg/dL","Mayor de 18 mg/dL"],"c":2,"ex":"Zona 3 de Kramer (abdomen inferior y muslos hasta las rodillas): alrededor de 12 mg/dL.","d":["Unos 6 mg/dL corresponde a la zona 1 (cabeza y cuello).","Unos 9 mg/dL corresponde a la zona 2 (tórax hasta el ombligo).","","Unos 15 mg/dL corresponde a la zona 4 (brazos y piernas hasta muñecas y tobillos).","Palmas y plantas (zona 5) se asocian a valores > 15 mg/dL; Kramer no permite precisar cifras tan altas."],"nem":null,"perla":"La ictericia progresa en sentido cefalocaudal. Kramer solo orienta: la fototerapia se decide con bilirrubina sérica o transcutánea según nomograma por horas de vida."},{"id":"s06","n":17,"dif":"difícil","p":"RN a término no vigoroso. Tras los pasos iniciales y 30 segundos de ventilación con presión positiva que expande adecuadamente el tórax, la frecuencia cardiaca es de 50 lpm. ¿Cuál es la conducta siguiente?","o":["Administrar adrenalina endovenosa de inmediato","Continuar solo VPP otros 30 segundos con aire ambiental","Asegurar vía aérea avanzada, iniciar compresiones torácicas coordinadas 3:1 y subir el oxígeno al 100 %","Iniciar compresiones con relación 15:2 como en el lactante","Administrar un bolo de solución salina de 10 mL/kg"],"c":2,"ex":"FC < 60 lpm tras 30 s de VPP efectiva: intubar o colocar mascarilla laríngea, iniciar compresiones coordinadas 3:1 (90 compresiones + 30 ventilaciones por minuto) y FiO2 al 100 %.","d":["La adrenalina se indica si la FC sigue < 60 lpm después de 60 s de compresiones coordinadas con ventilación efectiva.","Continuar solo con VPP corresponde a FC entre 60 y 100 lpm.","","La relación 15:2 es para RCP pediátrica con dos reanimadores; en el neonato la relación es 3:1.","El volumen se usa si hay sospecha de hipovolemia (pérdida sanguínea) o no hay respuesta a las medidas anteriores."],"nem":null,"perla":"Lo más importante de la reanimación neonatal es la ventilación efectiva. FC < 100: VPP; FC < 60: compresiones; FC < 60 tras 60 s de compresiones: adrenalina."},{"id":"s07","n":29,"dif":"difícil","p":"Varón de 22 años con fiebre progresiva de 10 días, cefalea, dolor abdominal difuso, bradicardia relativa, hepatoesplenomegalia y lengua saburral. ¿Cuál es el examen con MAYOR sensibilidad para confirmar el diagnóstico?","o":["Hemocultivo","Mielocultivo","Reacción de Widal","Coprocultivo","Urocultivo"],"c":1,"ex":"Fiebre tifoidea. El mielocultivo es el examen más sensible (80-95 %) y se mantiene positivo incluso con antibiótico previo.","d":["El hemocultivo es el más usado y de elección en la 1.ª semana, pero su sensibilidad es menor (40-80 %). Es la trampa más común.","","Widal tiene baja sensibilidad y especificidad (reacciones cruzadas); solo es orientador.","El coprocultivo se positiviza a partir de la 3.ª semana.","El urocultivo es tardío y poco sensible."],"nem":null,"perla":"Tratamiento: ceftriaxona en casos graves o azitromicina/ciprofloxacino según sensibilidad. El portador crónico aloja la bacteria en la vesícula biliar (asociado a colelitiasis)."},{"id":"s08","n":29,"dif":"intermedia","p":"Agricultor de 40 años que consume queso fresco de cabra artesanal presenta fiebre intermitente de 3 semanas, sudoración nocturna profusa de olor fétido, artralgias y dolor lumbar con sacroileítis. ¿Cuál es el agente más probable?","o":["Brucella melitensis","Salmonella Typhi","Bartonella bacilliformis","Leptospira interrogans","Coxiella burnetii"],"c":0,"ex":"Brucelosis: zoonosis por lácteos no pasteurizados (queso de cabra), fiebre ondulante, sudoración profusa y compromiso osteoarticular (sacroileítis, espondilitis).","d":["","La tifoidea da fiebre continua, bradicardia relativa y síntomas digestivos; no se relaciona con lácteos ni sacroileítis.","Bartonella causa la enfermedad de Carrión en valles interandinos: fiebre de la Oroya (anemia hemolítica) y verruga peruana; se transmite por Lutzomyia.","Leptospira: contacto con agua contaminada con orina de roedores, sufusión conjuntival y mialgias en pantorrillas.","Coxiella (fiebre Q) se asocia a ganado y causa neumonía atípica y hepatitis; no es típica la sacroileítis."],"nem":null,"perla":"Tratamiento de brucelosis: doxiciclina 6 semanas + rifampicina 6 semanas (o + estreptomicina/gentamicina)."},{"id":"s09","n":33,"dif":"intermedia","p":"Niño de 2 años con diarrea acuosa de 2 días. Está inquieto e irritable, tiene ojos hundidos, bebe con avidez y el signo del pliegue regresa lentamente. Según el MINSA, ¿cuál es el manejo?","o":["Plan A: SRO en casa después de cada deposición","Plan B: SRO 50-100 mL/kg en 4 horas en el establecimiento","Plan C: Lactato de Ringer 100 mL/kg endovenoso","Plan B: SRO 20 mL/kg en 1 hora y alta","Hidratación EV 30 mL/kg en 30 minutos y luego 70 mL/kg en 2 horas y media"],"c":1,"ex":"Tiene 2 o más signos de deshidratación sin signos de gravedad: Plan B, SRO 50-100 mL/kg en 4 horas, supervisado en el establecimiento, y luego reevaluar.","d":["El Plan A es para el niño sin deshidratación.","","El Plan C es para deshidratación grave o shock (letárgico, no puede beber, pliegue muy lento ≥ 2 s).","Ese esquema no existe en la norma; el Plan B dura 4 horas con reevaluación.","Es el esquema del Plan C en ≥ 12 meses; aquí no hay signos de gravedad."],"nem":null,"perla":"Pliegue que regresa lentamente: deshidratación; muy lentamente (≥ 2 s): grave. Agrega zinc por 10-14 días y continúa la alimentación."},{"id":"s10","n":39,"dif":"intermedia","p":"Mujer de 45 años en el 5.º día postoperatorio de cirugía de rodilla, con edema doloroso de toda la pierna izquierda (4 cm más de diámetro en pantorrilla). Wells: TVP probable. ¿Cuál es el siguiente paso diagnóstico?","o":["Dímero D y, si es negativo, descartar TVP","Ecografía Doppler venosa con compresión","Flebografía con contraste","AngioTEM de tórax","Trombólisis sistémica"],"c":1,"ex":"Con probabilidad clínica alta (Wells probable) se va directo a la ecografía Doppler compresiva, prueba de elección.","d":["El dímero D sirve para descartar en probabilidad baja (alto valor predictivo negativo); además, en el postoperatorio suele estar elevado.","","La flebografía es invasiva; ya no es de primera línea.","La angioTEM evalúa TEP, no TVP de miembro inferior.","La trombólisis no es un paso diagnóstico y solo se reserva para casos seleccionados (flegmasía cerúlea dolens)."],"nem":null,"perla":"Si la sospecha es alta y la ecografía demorará, puede iniciarse anticoagulación empírica si no hay contraindicación."},{"id":"s11","n":43,"dif":"intermedia","p":"RN con cataratas bilaterales, hipoacusia neurosensorial y soplo continuo 'en maquinaria' en el foco infraclavicular izquierdo. La madre tuvo un exantema leve en el primer trimestre. ¿Cuál es la infección congénita más probable?","o":["Toxoplasmosis","Citomegalovirus","Rubéola","Sífilis","Herpes simple"],"c":2,"ex":"Tríada de Gregg (rubéola congénita): cataratas, sordera neurosensorial y cardiopatía (persistencia del conducto arterioso).","d":["Toxoplasmosis: tríada de Sabin (coriorretinitis, hidrocefalia y calcificaciones intracraneales difusas).","El CMV también da hipoacusia neurosensorial (es su principal causa no genética), pero se asocia a microcefalia y calcificaciones periventriculares, no a cataratas con PCA.","","Sífilis congénita: rinitis serosanguinolenta, pénfigo palmoplantar, hepatoesplenomegalia y osteocondritis.","El herpes neonatal suele ser perinatal: vesículas, queratoconjuntivitis y encefalitis."],"nem":"TORCH: Toxoplasma, Otros (sífilis, varicela, parvovirus B19, VIH), Rubéola, Citomegalovirus, Herpes.","perla":"La infección congénita más frecuente es la de CMV. La rubéola es más grave cuanto más precoz es la infección (primer trimestre)."},{"id":"s12","n":43,"dif":"difícil","p":"RN con microcefalia, petequias, hepatoesplenomegalia y en la ecografía transfontanelar calcificaciones periventriculares. ¿Cuál es el agente más probable?","o":["Toxoplasma gondii","Citomegalovirus","Virus de la rubéola","Treponema pallidum","Virus varicela-zóster"],"c":1,"ex":"CMV congénito: microcefalia, calcificaciones periventriculares, petequias ('muffin de arándanos'), hepatoesplenomegalia e hipoacusia neurosensorial.","d":["La toxoplasmosis da calcificaciones difusas (en parénquima) e hidrocefalia, no microcefalia típica.","","La rubéola se caracteriza por cataratas, sordera y PCA.","La sífilis no produce calcificaciones intracraneales; da lesiones mucocutáneas y óseas.","La varicela congénita produce cicatrices cutáneas en dermatomas e hipoplasia de miembros."],"nem":"Para ubicar las calcificaciones: CMV rodea los ventrículos (periventriculares); el Toxoplasma se dispersa (difusas).","perla":"El CMV es la causa más frecuente de hipoacusia neurosensorial no genética en la infancia. Tratamiento en sintomáticos: valganciclovir."},{"id":"s13","n":51,"dif":"difícil","p":"Varón de 58 años con ascitis. Albúmina sérica 3,0 g/dL, albúmina en líquido ascítico 1,4 g/dL y proteínas totales en el líquido 3,2 g/dL. ¿Cuál es la causa más probable?","o":["Cirrosis hepática","Insuficiencia cardiaca derecha","Carcinomatosis peritoneal","Tuberculosis peritoneal","Síndrome nefrótico"],"c":1,"ex":"GASA = 3,0 − 1,4 = 1,6 (≥ 1,1: hipertensión portal) con proteínas ≥ 2,5 g/dL: causa poshepática (insuficiencia cardiaca, Budd-Chiari).","d":["La cirrosis da GASA ≥ 1,1 pero con proteínas < 2,5 g/dL (sinusoides capilarizados).","","La carcinomatosis da GASA < 1,1 con proteínas altas.","La tuberculosis peritoneal da GASA < 1,1, proteínas altas y ADA elevado.","El nefrótico da GASA < 1,1 y proteínas bajas."],"nem":null,"perla":"PBE: PMN ≥ 250/mm³ en líquido ascítico. Tratamiento: cefotaxima + albúmina (1,5 g/kg el día 1 y 1 g/kg el día 3)."},{"id":"s14","n":54,"dif":"difícil","p":"Mujer de 62 años con anemia macrocítica (VCM 118 fL), neutrófilos hipersegmentados, parestesias en pies y pérdida de la sensibilidad vibratoria. ¿Qué hallazgo permite diferenciar el déficit de vitamina B12 del de folato?","o":["Homocisteína elevada","Ácido metilmalónico elevado","LDH elevada","Bilirrubina indirecta elevada","Reticulocitos bajos"],"c":1,"ex":"El ácido metilmalónico se eleva solo en el déficit de B12 (la B12 es cofactor de la metilmalonil-CoA mutasa).","d":["La homocisteína se eleva en ambos déficits.","","La LDH sube en ambos por eritropoyesis ineficaz (hemólisis intramedular).","La bilirrubina indirecta sube en ambos por la misma razón.","La reticulocitopenia es común a ambos."],"nem":null,"perla":"Los síntomas neurológicos (degeneración combinada subaguda) solo ocurren en el déficit de B12. Dar folato sin B12 corrige la anemia pero empeora el daño neurológico."},{"id":"s15","n":55,"dif":"intermedia","p":"Mujer de 29 años con dismenorrea progresiva, dispareunia profunda e infertilidad de 2 años. ¿Cuál es el método diagnóstico de certeza?","o":["Ecografía transvaginal","CA-125 sérico","Resonancia magnética pélvica","Laparoscopía con biopsia de las lesiones","Histeroscopía diagnóstica"],"c":3,"ex":"La laparoscopía con confirmación histológica es el estándar de oro de la endometriosis.","d":["La ecografía transvaginal es el primer estudio de imagen; detecta endometriomas ('vidrio esmerilado') pero no implantes peritoneales.","El CA-125 puede elevarse, pero es inespecífico y no confirma.","La RM ayuda en la endometriosis profunda, pero no es de certeza.","","La histeroscopía evalúa la cavidad uterina (pólipos, miomas submucosos), no el peritoneo."],"nem":null,"perla":"Localización más frecuente: ovario. Teoría más aceptada: menstruación retrógrada (Sampson). Primera línea para el dolor: AINE + progestágenos o anticonceptivos combinados."},{"id":"s16","n":58,"dif":"intermedia","p":"RN macrosómico, hijo de madre con diabetes mal controlada. ¿Cuál es la complicación metabólica más frecuente en las primeras horas de vida?","o":["Hipocalcemia","Hipoglicemia","Hipomagnesemia","Hiperbilirrubinemia","Policitemia"],"c":1,"ex":"La hiperglicemia materna produce hiperinsulinismo fetal (hipótesis de Pedersen); al cortar el cordón cesa el aporte de glucosa y aparece hipoglicemia en las primeras horas.","d":["La hipocalcemia ocurre, pero típicamente entre las 24 y 72 horas.","","La hipomagnesemia acompaña a la hipocalcemia y es menos frecuente.","La hiperbilirrubinemia aparece después del 2.º-3.er día.","La policitemia es frecuente, pero no es la alteración metabólica más común de las primeras horas."],"nem":null,"perla":"Malformación más específica del hijo de madre diabética: síndrome de regresión caudal. Cardiopatía típica: miocardiopatía hipertrófica septal (transitoria)."},{"id":"s17","n":59,"dif":"difícil","p":"RN de 12 horas con cianosis intensa que no mejora con oxígeno al 100 % y sin dificultad respiratoria importante. Rx: silueta cardiaca 'en huevo sobre un hilo' con flujo pulmonar aumentado. ¿Diagnóstico y medida inicial?","o":["Tetralogía de Fallot; propranolol","Transposición de grandes arterias; prostaglandina E1","Atresia tricuspídea; indometacina","Retorno venoso pulmonar anómalo total; digoxina","Conducto arterioso persistente; ibuprofeno"],"c":1,"ex":"TGA: cianosis neonatal precoz y grave, 'huevo sobre un hilo'. La prostaglandina E1 mantiene abierto el ductus para permitir mezcla; luego septostomía (Rashkind) y switch arterial (Jatene).","d":["Fallot da corazón 'en bota o zueco' con flujo pulmonar disminuido; el propranolol es para las crisis hipoxémicas.","","La indometacina cierra el ductus: sería letal en una cardiopatía ductus-dependiente.","El RVPAT supracardiaco da imagen 'en muñeco de nieve' u 'ocho'.","El conducto arterioso persistente es acianótico y da soplo 'en maquinaria'."],"nem":null,"perla":"Cianótica más frecuente en el neonato: TGA. Cianótica más frecuente después del periodo neonatal: Fallot. Cardiopatía congénita más frecuente: CIV."},{"id":"s18","n":62,"dif":"difícil","p":"Varón de 60 años con dolor torácico opresivo de 2 horas y elevación del ST en V1-V4. Está en un hospital sin hemodinámica y el traslado para angioplastia demorará unas 3 horas. Sin contraindicaciones. ¿Mejor estrategia de reperfusión?","o":["Esperar el traslado para angioplastia primaria","Fibrinólisis inmediata y traslado a un centro con ICP (estrategia farmacoinvasiva)","Solo antiagregación dual y anticoagulación","Cirugía de revascularización de urgencia","Fibrinólisis solo si el dolor supera las 12 horas"],"c":1,"ex":"Si la ICP primaria no puede hacerse dentro de 120 minutos del diagnóstico, se indica fibrinólisis lo antes posible (dentro de las 12 h de síntomas) y luego traslado para angiografía.","d":["Esperar más de 120 minutos para ICP aumenta la mortalidad frente a fibrinolizar.","","Antiagregar y anticoagular es necesario, pero no reperfunde.","La cirugía de revascularización no es la estrategia inicial de reperfusión.","Al revés: la fibrinólisis no está indicada pasadas 12 horas sin evidencia de isquemia persistente."],"nem":"MONA (Morfina, Oxígeno, Nitratos, Ácido acetilsalicílico): clásica del manejo inicial; hoy el oxígeno solo se da si SatO2 < 90 % y la morfina solo para dolor refractario.","perla":"IAM de cara anterior (V1-V4): arteria descendente anterior. Inferior (DII, DIII, aVF): coronaria derecha en la mayoría."},{"id":"s19","n":63,"dif":"difícil","p":"Mujer de 24 años con ciclos de 45-60 días e hirsutismo. La ecografía muestra ovarios de volumen normal sin múltiples folículos. Tras descartar otras causas, ¿cumple criterios de SOP según Rotterdam?","o":["No, porque la ecografía es normal","Sí, porque cumple oligoanovulación e hiperandrogenismo clínico","No, porque se requiere resistencia a la insulina demostrada","No, porque se necesitan los tres criterios","Sí, solo si la relación LH/FSH es mayor de 2"],"c":1,"ex":"Rotterdam exige 2 de 3 criterios (oligo/anovulación, hiperandrogenismo clínico o bioquímico, morfología ovárica poliquística), habiendo excluido otras causas.","d":["La ecografía no es obligatoria si ya hay los otros dos criterios.","","La resistencia a la insulina es frecuente, pero no es criterio diagnóstico.","Basta con 2 de los 3.","La relación LH/FSH no forma parte de los criterios."],"nem":null,"perla":"Tratamiento: anticonceptivos combinados para irregularidad e hirsutismo; letrozol es primera línea para inducir ovulación."},{"id":"s20","n":71,"dif":"intermedia","p":"Se compara la presión arterial sistólica media (variable cuantitativa con distribución normal) entre dos grupos independientes: pacientes con fármaco A y con fármaco B. ¿Qué prueba corresponde?","o":["Chi cuadrado","t de Student para muestras independientes","t de Student pareada","ANOVA de un factor","U de Mann-Whitney"],"c":1,"ex":"Variable cuantitativa normal + 2 grupos independientes = t de Student para muestras independientes.","d":["Chi cuadrado compara variables cualitativas (proporciones).","","La t pareada es para el mismo grupo medido dos veces (antes-después).","ANOVA compara 3 o más grupos.","Mann-Whitney es la alternativa no paramétrica (cuando no hay normalidad)."],"nem":null,"perla":"Equivalentes no paramétricos: t independiente → U de Mann-Whitney; t pareada → Wilcoxon; ANOVA → Kruskal-Wallis."},{"id":"s21","n":71,"dif":"intermedia","p":"Un ensayo concluye que un fármaco es eficaz (p = 0,03), pero en realidad el fármaco no tiene efecto. ¿Qué error se cometió?","o":["Error tipo I (α)","Error tipo II (β)","Sesgo de selección","Falta de potencia estadística","Error de clasificación no diferencial"],"c":0,"ex":"Rechazar la hipótesis nula cuando es verdadera = error tipo I (falso positivo). Su probabilidad máxima es α.","d":["","El error tipo II es no rechazar una hipótesis nula falsa (falso negativo).","El sesgo de selección es un error sistemático del diseño, no un error de la prueba de hipótesis.","La falta de potencia favorece el error tipo II, no el tipo I.","El error de clasificación es un sesgo de información."],"nem":null,"perla":"Potencia = 1 − β: probabilidad de detectar una diferencia que sí existe. Aumenta con mayor tamaño muestral."},{"id":"s22","n":80,"dif":"intermedia","p":"Prematuro de 30 semanas, 10 días de vida, alimentado con fórmula, presenta distensión abdominal, residuo gástrico bilioso y deposiciones con sangre. ¿Qué hallazgo radiológico es característico?","o":["Doble burbuja","Neumatosis intestinal","Imagen 'en grano de café'","Triple burbuja sin gas distal","Microcolon"],"c":1,"ex":"Enterocolitis necrotizante: la neumatosis intestinal (gas en la pared) es el signo radiológico característico (estadio II de Bell).","d":["La doble burbuja es de atresia duodenal.","","El 'grano de café' es del vólvulo de sigmoides en adultos.","La triple burbuja sugiere atresia yeyunal.","El microcolon se ve en íleo meconial o atresia ileal."],"nem":null,"perla":"Gas portal indica gravedad; neumoperitoneo indica perforación y cirugía. Tratamiento médico: ayuno, sonda gástrica y antibióticos. La leche materna es el principal factor protector."},{"id":"s23","n":87,"dif":"intermedia","p":"Lactante de 6 meses con primer episodio de rinorrea, tos y sibilancias difusas. FR 50/min, SatO2 95 % al aire, se alimenta bien. ¿Cuál es el manejo más adecuado?","o":["Nebulización con salbutamol cada 20 minutos","Dexametasona oral","Soporte: lavados nasales, hidratación, alimentación fraccionada y signos de alarma","Amoxicilina por 7 días","Hospitalizar para oxigenoterapia"],"c":2,"ex":"Bronquiolitis leve: el tratamiento es de soporte en casa con educación sobre signos de alarma.","d":["Los broncodilatadores no se recomiendan de rutina en la bronquiolitis.","Los corticoides no han demostrado beneficio.","","Es viral (VSR); los antibióticos no están indicados sin sobreinfección.","El oxígeno se indica si la SatO2 es < 90-92 %; aquí es 95 %."],"nem":null,"perla":"Agente más frecuente: virus sincitial respiratorio. Mayor riesgo de gravedad: < 3 meses, prematuros, cardiopatías y displasia broncopulmonar."},{"id":"s24","n":89,"dif":"intermedia","p":"Mujer de 38 años con menorragia que le causa anemia. Ecografía: mioma único de 2 cm que protruye más del 50 % en la cavidad endometrial. Desea fertilidad. ¿Tipo de mioma y tratamiento de elección?","o":["Subseroso; miomectomía laparoscópica","Intramural; histerectomía","Submucoso; miomectomía histeroscópica","Pediculado; embolización de arterias uterinas","Submucoso; histerectomía total"],"c":2,"ex":"El mioma que protruye en la cavidad es submucoso; es el que más sangra y altera la fertilidad. Se reseca por histeroscopía, conservando el útero.","d":["El subseroso crece hacia la serosa; suele dar síntomas compresivos, no menorragia.","El intramural es el más frecuente, pero la imagen describe protrusión en la cavidad; además, la histerectomía no conserva fertilidad.","","La embolización no es de elección en quien desea gestar.","La histerectomía no conserva la fertilidad."],"nem":null,"perla":"Más frecuente: intramural. Degeneración más frecuente: hialina. En el embarazo: degeneración roja (carnosa)."},{"id":"s25","n":94,"dif":"datito","p":"Niña de 5 años con prurito anal nocturno intenso, irritabilidad y despertares; su hermano tiene síntomas similares. ¿Cuál es el método diagnóstico de elección?","o":["Examen parasitológico seriado de heces","Test de Graham (cinta adhesiva) por la mañana","Método de Baermann","Serología","Biopsia rectal"],"c":1,"ex":"Enterobius vermicularis deposita sus huevos en la piel perianal por la noche; se recogen con cinta adhesiva al despertar (test de Graham).","d":["El seriado de heces tiene baja sensibilidad para Enterobius porque los huevos no se eliminan en las heces.","","El método de Baermann busca larvas de Strongyloides.","La serología no se usa para oxiuros.","La biopsia no está indicada."],"nem":null,"perla":"Tratamiento: albendazol 400 mg dosis única, repetir a las 2 semanas y tratar a toda la familia. Puede causar vulvovaginitis en niñas."},{"id":"s26","n":95,"dif":"intermedia","p":"Lactante de 8 meses, sano, con episodios de llanto intenso y encogimiento de piernas cada 15-20 minutos, vómitos y deposición con moco y sangre 'en jalea de grosella'. Se palpa una masa alargada en hipocondrio derecho. ¿Qué estudio confirma el diagnóstico?","o":["Radiografía simple de abdomen","Ecografía abdominal (signo de la diana o 'donut')","Tomografía abdominal con contraste","Tránsito intestinal con bario","Colonoscopía"],"c":1,"ex":"Invaginación intestinal: la ecografía es el estudio de elección (diana en corte transversal, 'pseudorriñón' en longitudinal).","d":["La Rx simple puede ser normal o mostrar obstrucción; no confirma.","","La TC no es necesaria y expone a radiación.","El bario está contraindicado si hay sospecha de perforación y ya no se usa para diagnosticar.","La colonoscopía no tiene papel en el diagnóstico."],"nem":null,"perla":"Tipo más frecuente: ileocólica. Tratamiento: reducción hidrostática o neumática si está estable sin peritonitis; cirugía si falla. Pasados los 2-3 años, buscar punto guía (divertículo de Meckel, pólipo, linfoma)."},{"id":"s27","n":133,"dif":"intermedia","p":"RN de 1 día con vómitos biliosos desde las primeras horas, sin distensión abdominal importante. Tiene hendiduras palpebrales oblicuas y pliegue palmar único. Rx: 'doble burbuja' sin gas distal. ¿Diagnóstico más probable?","o":["Estenosis hipertrófica de píloro","Atresia duodenal","Malrotación con vólvulo de intestino medio","Enfermedad de Hirschsprung","Atresia esofágica"],"c":1,"ex":"Doble burbuja sin gas distal + síndrome de Down = atresia duodenal (la mayoría es posampular, por eso el vómito es bilioso).","d":["La estenosis de píloro aparece a las 3-6 semanas con vómitos NO biliosos y 'oliva' palpable.","","La malrotación con vólvulo también da vómitos biliosos y es una urgencia, pero suele haber algo de gas distal y no se asocia a Down.","Hirschsprung se presenta con retraso en la eliminación de meconio (> 48 h) y distensión.","La atresia esofágica da sialorrea y no permite el paso de la sonda."],"nem":null,"perla":"Alrededor del 30 % de las atresias duodenales tiene síndrome de Down. Antecedente: polihidramnios. Cirugía: duodenoduodenostomía en diamante (Kimura)."},{"id":"s28","n":134,"dif":"intermedia","p":"Paciente con úlcera duodenal y H. pylori positivo que recibió terapia triple estándar. ¿Cuál es el método recomendado para confirmar la erradicación?","o":["Serología IgG a las 2 semanas","Test de aliento con urea, al menos 4 semanas después de los antibióticos y 2 semanas sin IBP","Endoscopía con prueba de ureasa al terminar el tratamiento","Serología IgM","Antígeno en heces al día siguiente de terminar el tratamiento"],"c":1,"ex":"El test de aliento con urea marcada es de elección para el control, respetando 4 semanas sin antibióticos y 2 semanas sin IBP para evitar falsos negativos.","d":["La serología permanece positiva meses o años: no sirve para control.","","La endoscopía no es necesaria en la úlcera duodenal no complicada; y hacerla al terminar da falsos negativos.","La IgM no se usa.","El antígeno en heces también es válido, pero solo pasadas 4 semanas."],"nem":null,"perla":"Triple terapia: IBP + claritromicina + amoxicilina por 14 días (metronidazol si alergia a penicilina). Con alta resistencia a claritromicina, preferir cuádruple con bismuto."},{"id":"s29","n":145,"dif":"datito","p":"¿Cuál de los siguientes es un criterio MAYOR de Framingham para insuficiencia cardiaca?","o":["Edema maleolar bilateral","Tos nocturna","Disnea de esfuerzo","Ingurgitación yugular","Hepatomegalia"],"c":3,"ex":"Criterios mayores: disnea paroxística nocturna, ingurgitación yugular, estertores, cardiomegalia, edema agudo de pulmón, galope S3, reflujo hepatoyugular y PVC elevada.","d":["El edema maleolar es criterio menor.","La tos nocturna es criterio menor.","La disnea de esfuerzo es criterio menor (no confundir con la disnea paroxística nocturna, que es mayor).","","La hepatomegalia es criterio menor (el reflujo hepatoyugular sí es mayor)."],"nem":null,"perla":"Diagnóstico: 2 criterios mayores, o 1 mayor + 2 menores."},{"id":"s30","n":163,"dif":"difícil","p":"Mujer de 35 años de Cajamarca que consume ensaladas de berros presenta fiebre, dolor en hipocondrio derecho, hepatomegalia y eosinofilia marcada. ¿Cuál es el tratamiento de elección?","o":["Albendazol","Praziquantel","Triclabendazol","Ivermectina","Metronidazol"],"c":2,"ex":"Fascioliasis (Fasciola hepatica). El fármaco de elección es el triclabendazol.","d":["El albendazol se usa en nematodos e hidatidosis; es poco eficaz en Fasciola.","Es la trampa: el praziquantel trata casi todos los tremátodos y céstodos, pero NO es eficaz contra Fasciola.","","La ivermectina es de elección en Strongyloides.","El metronidazol trata amebas y Giardia."],"nem":null,"perla":"Huésped intermediario: caracol Lymnaea. Zonas endémicas en Perú: Cajamarca, Junín, Puno y Arequipa. Fase crónica: obstrucción biliar."},{"id":"s31","n":171,"dif":"intermedia","p":"Mujer de 23 años con dolor pélvico bajo, flujo mucopurulento y dolor a la movilización cervical. T 37,8 °C, tolera vía oral, sin masa anexial en la ecografía y test de embarazo negativo. ¿Cuál es el manejo adecuado?","o":["Hospitalizar para antibióticos endovenosos","Ambulatorio: ceftriaxona IM dosis única + doxiciclina 14 días ± metronidazol 14 días","Laparoscopía diagnóstica urgente","Retirar el DIU si lo tuviera y observar","Solo metronidazol por 7 días"],"c":1,"ex":"EPI leve-moderada sin criterios de hospitalización: tratamiento ambulatorio que cubra gonococo, clamidia y anaerobios.","d":["Se hospitaliza si hay absceso tuboovárico, embarazo, intolerancia oral, falla del tratamiento ambulatorio, cuadro grave o urgencia quirúrgica no descartada.","","La laparoscopía es el estándar de oro diagnóstico, pero no se necesita para iniciar el tratamiento.","No es obligatorio retirar el DIU; se trata y se reevalúa a las 48-72 horas.","El metronidazol solo no cubre gonococo ni clamidia."],"nem":null,"perla":"Criterios mínimos: dolor a la movilización cervical, dolor uterino o dolor anexial. Secuelas: infertilidad, embarazo ectópico y síndrome de Fitz-Hugh-Curtis."},{"id":"s32","n":1,"dif":"intermedia","p":"Varón de 20 años con dolor periumbilical que migró a fosa ilíaca derecha hace 12 horas, anorexia, T 37,9 °C y leucocitosis con desviación izquierda. Al presionar la fosa ilíaca izquierda refiere dolor en la derecha. ¿Qué signo es?","o":["Signo de Blumberg","Signo de Rovsing","Signo del psoas","Signo del obturador","Signo de Murphy"],"c":1,"ex":"Rovsing: dolor en fosa ilíaca derecha al presionar la izquierda.","d":["Blumberg es dolor al descomprimir bruscamente (rebote): irritación peritoneal.","","El psoas: dolor al extender la cadera derecha; sugiere apéndice retrocecal.","El obturador: dolor a la rotación interna del muslo flexionado; sugiere apéndice pélvico.","Murphy es de colecistitis aguda."],"nem":null,"perla":"Alvarado ≥ 7: alta probabilidad. Lo más específico de la historia es la migración del dolor. Obstrucción: hiperplasia linfoide en jóvenes, fecalito en adultos."},{"id":"s33","n":2,"dif":"difícil","p":"Mujer de 65 años con fiebre con escalofríos, ictericia y dolor en hipocondrio derecho; luego presenta confusión y PA 80/50 mmHg. Tras reanimación y antibióticos, ¿cuál es la conducta definitiva?","o":["Colecistectomía laparoscópica urgente","Drenaje biliar urgente, de preferencia por CPRE","Ecografía de control en 72 horas","Colangiorresonancia y alta","Colecistostomía percutánea como única medida"],"c":1,"ex":"Colangitis aguda grave (péntada de Reynolds): requiere descompresión biliar urgente, idealmente por CPRE con esfinterotomía y extracción del cálculo.","d":["La colecistectomía se difiere hasta resolver la colangitis.","","Esperar en una colangitis grave aumenta la mortalidad.","La colangiorresonancia solo es diagnóstica.","La colecistostomía drena la vesícula, no el colédoco obstruido."],"nem":null,"perla":"Tríada de Charcot: fiebre, ictericia y dolor en hipocondrio derecho. Péntada de Reynolds: + hipotensión y alteración del sensorio. Causa más frecuente: coledocolitiasis."},{"id":"s34","n":3,"dif":"intermedia","p":"Durante una hernioplastia inguinal se observa que el saco herniario sale medial a los vasos epigástricos inferiores, a través del piso del conducto inguinal. ¿Qué tipo de hernia es?","o":["Hernia inguinal indirecta","Hernia inguinal directa","Hernia crural (femoral)","Hernia de Spiegel","Hernia obturatriz"],"c":1,"ex":"La hernia directa protruye por el triángulo de Hesselbach (medial a los vasos epigástricos inferiores) por debilidad de la fascia transversalis.","d":["La indirecta sale lateral a los vasos epigástricos, por el anillo inguinal profundo (persistencia del conducto peritoneovaginal). Es la más frecuente en ambos sexos.","","La crural sale por debajo del ligamento inguinal, medial a la vena femoral; es más frecuente en mujeres y la que más se estrangula.","La de Spiegel ocurre en la línea semilunar.","La obturatriz es típica de mujer anciana delgada (signo de Howship-Romberg)."],"nem":null,"perla":"Triángulo de Hesselbach: vasos epigástricos inferiores (lateral), borde del recto abdominal (medial) y ligamento inguinal (inferior)."},{"id":"s35","n":16,"dif":"intermedia","p":"Puérpera de 2 horas tras parto vaginal de feto macrosómico con trabajo de parto prolongado. Presenta sangrado vaginal abundante y útero blando por encima del ombligo. ¿Causa y primera medida?","o":["Retención de restos; legrado inmediato","Atonía uterina; masaje uterino bimanual y oxitocina","Desgarro cervical; sutura","Coagulopatía; plasma fresco congelado","Inversión uterina; reposición manual"],"c":1,"ex":"Útero blando y por encima del ombligo con sangrado = atonía uterina, la causa más frecuente de hemorragia posparto. Primera medida: masaje uterino y oxitocina.","d":["Los restos placentarios se sospechan con placenta incompleta; el útero puede estar parcialmente contraído.","","El desgarro sangra con útero bien contraído.","La coagulopatía es menos frecuente y se sospecha por sangrado en sitios de punción o sin coágulos.","En la inversión uterina no se palpa el fondo uterino en el abdomen."],"nem":"Las 4 T de la hemorragia posparto: Tono (atonía, ~70 %), Trauma (desgarros, inversión), Tejido (restos placentarios) y Trombina (coagulopatía).","perla":"Uterotónicos: oxitocina (primera línea), ergometrina (contraindicada en hipertensión o preeclampsia), misoprostol, carbetocina. Ácido tranexámico dentro de las primeras 3 horas."},{"id":"s36","n":15,"dif":"intermedia","p":"Gestante de 34 semanas con preeclampsia con criterios de severidad recibe sulfato de magnesio. Presenta somnolencia, ausencia de reflejos rotulianos y FR 10/min. ¿Cuál es la conducta inmediata?","o":["Aumentar la dosis de sulfato de magnesio","Suspender la infusión y administrar gluconato de calcio al 10 %, 1 g EV","Administrar diazepam EV","Administrar labetalol EV","Administrar furosemida EV"],"c":1,"ex":"Toxicidad por magnesio (pérdida de reflejos y depresión respiratoria): suspender el sulfato y dar el antídoto, gluconato de calcio.","d":["Aumentar la dosis empeoraría la intoxicación.","","El diazepam agravaría la depresión respiratoria y no es antídoto.","El labetalol trata la hipertensión, no la intoxicación.","La furosemida no es la medida inmediata."],"nem":null,"perla":"Secuencia de toxicidad: pérdida del reflejo rotuliano → depresión respiratoria → paro cardiaco. Vigilar reflejos, FR y diuresis (> 25-30 mL/h)."},{"id":"s37","n":31,"dif":"intermedia","p":"Gestante de 35 semanas con preeclampsia presenta dolor abdominal súbito e intenso, sangrado vaginal oscuro escaso, útero hipertónico y doloroso, y alteración de la FCF. ¿Diagnóstico más probable?","o":["Placenta previa","Desprendimiento prematuro de placenta","Rotura uterina","Vasa previa","Amenaza de parto pretérmino"],"c":1,"ex":"DPP: dolor, hipertonía uterina, sangrado oscuro (puede ser escaso porque queda retroplacentario) y sufrimiento fetal. El principal factor de riesgo es la hipertensión.","d":["La placenta previa da sangrado rojo rutilante, indoloro, con útero blando.","","La rotura uterina se asocia a cesárea previa: dolor súbito con cese de contracciones y partes fetales palpables.","La vasa previa sangra al romperse las membranas, con sufrimiento fetal agudo y madre estable.","La amenaza de parto pretérmino no explica hipertonía con sangrado y sufrimiento fetal."],"nem":null,"perla":"Complicaciones del DPP: útero de Couvelaire y CID. Otros factores: trauma abdominal, cocaína, tabaquismo y rotura prematura de membranas."},{"id":"s38","n":212,"dif":"datito","p":"Niño afrodescendiente de 18 meses con dactilitis dolorosa de manos y pies y anemia hemolítica. ¿Cuál es la alteración molecular de su enfermedad?","o":["Sustitución de ácido glutámico por valina en la posición 6 de la cadena beta","Sustitución de ácido glutámico por lisina en la posición 6 de la cadena beta","Deleción de genes de la cadena alfa","Defecto de espectrina en la membrana","Déficit de glucosa-6-fosfato deshidrogenasa"],"c":0,"ex":"Anemia falciforme (HbS): valina reemplaza al ácido glutámico en la posición 6 de la globina beta. La dactilitis (síndrome mano-pie) suele ser la primera manifestación.","d":["","La sustitución por lisina produce la hemoglobina C.","La deleción de genes alfa produce talasemia alfa.","El defecto de espectrina causa esferocitosis hereditaria.","El déficit de G6PD da hemólisis episódica ante oxidantes (habas, fármacos)."],"nem":null,"perla":"La asplenia funcional predispone a infecciones por encapsulados (neumococo) y osteomielitis por Salmonella. La hidroxiurea aumenta la HbF."},{"id":"s39","n":238,"dif":"intermedia","p":"Mujer de 37 años, fumadora de 20 cigarrillos al día, solicita anticoncepción. ¿Qué método está contraindicado (categoría 4 de la OMS)?","o":["DIU de cobre","Anticonceptivo oral combinado","Implante de etonogestrel","DIU con levonorgestrel","Píldora de solo progestágeno"],"c":1,"ex":"Mujer ≥ 35 años que fuma ≥ 15 cigarrillos al día: los métodos con estrógenos son categoría 4 por riesgo cardiovascular y trombótico.","d":["El DIU de cobre no tiene hormonas: categoría 1.","","El implante solo tiene progestágeno: puede usarse.","El DIU con levonorgestrel es una opción segura.","La píldora de solo progestágeno puede usarse."],"nem":null,"perla":"Otras categorías 4 para combinados: migraña con aura, antecedente de TVP/TEP, PA ≥ 160/100, puerperio < 21 días, cáncer de mama actual y lactancia < 6 semanas."},{"id":"s40","n":24,"dif":"intermedia","p":"Varón de 70 años con neumonía, confuso, urea 60 mg/dL, FR 32/min y PA 110/70 mmHg. ¿Cuál es su puntaje CURB-65?","o":["2","3","4","5","1"],"c":2,"ex":"Confusión (1) + urea > 42 mg/dL (BUN > 19) (1) + FR ≥ 30 (1) + PA sistólica < 90 o diastólica ≤ 60 (0) + edad ≥ 65 (1) = 4.","d":["Subestima: faltan criterios por contar.","Olvida uno de los criterios (suele olvidarse la edad o la urea).","","La PA de 110/70 no cumple el criterio de presión.","Muy por debajo del puntaje real."],"nem":null,"perla":"0-1: ambulatorio; 2: hospitalización; ≥ 3: neumonía grave (considerar UCI con 4-5)."},{"id":"s41","n":13,"dif":"intermedia","p":"Gestante de 9 semanas con sangrado vaginal abundante y dolor cólico. Al examen el orificio cervical interno está abierto con restos en el canal y la ecografía muestra contenido heterogéneo en la cavidad, sin saco gestacional íntegro. ¿Cuál es el diagnóstico?","o":["Amenaza de aborto","Aborto inevitable","Aborto incompleto","Aborto retenido","Aborto completo"],"c":2,"ex":"OCI abierto + expulsión parcial con restos en cavidad = aborto incompleto. Manejo < 12 semanas: AMEU (o legrado/misoprostol según el caso).","d":["En la amenaza el OCI está cerrado y el embrión vivo.","En el inevitable el OCI está abierto pero aún no hay expulsión de restos (o hay rotura de membranas).","","En el retenido el OCI está cerrado con embrión sin actividad cardiaca.","En el completo la cavidad está vacía y el OCI tiende a cerrarse."],"nem":null,"perla":"La causa más frecuente de aborto del primer trimestre son las alteraciones cromosómicas (trisomías autosómicas)."},{"id":"s42","n":18,"dif":"difícil","p":"Puérpera con preeclampsia presenta dolor epigástrico. Laboratorio: plaquetas 85 000/mm³, LDH 750 UI/L, AST 120 UI/L y esquistocitos en lámina periférica. ¿Diagnóstico?","o":["Hígado graso agudo del embarazo","Síndrome HELLP","Púrpura trombocitopénica trombótica","Colestasis intrahepática del embarazo","Hepatitis viral aguda"],"c":1,"ex":"HELLP: hemólisis (LDH ≥ 600, esquistocitos), enzimas hepáticas elevadas (AST ≥ 70) y plaquetas < 100 000 (criterios de Tennessee).","d":["El hígado graso agudo da hipoglicemia, coagulopatía marcada e insuficiencia hepática, con hemólisis menos prominente.","","La PTT da trombocitopenia y anemia hemolítica con fiebre, alteración neurológica y renal, sin transaminasas tan altas ni preeclampsia.","La colestasis da prurito y ácidos biliares elevados, sin hemólisis ni trombocitopenia.","La hepatitis viral no explica la hemólisis con trombocitopenia en el contexto de preeclampsia."],"nem":null,"perla":"El HELLP puede aparecer en el puerperio y sin hipertensión grave. Complicación temida: hematoma subcapsular hepático."}];

const writeQ = {}; const timers = {};
function persist(doc){
  const data = doc==="progreso"?S.progreso: doc==="fallos"?S.fallos: S.bancos[+doc.slice(6)];
  if(!data) return;
  lsSet(doc,data);
  if(!S.db||!S.uid) return;
  clearTimeout(timers[doc]);
  timers[doc]=setTimeout(()=>{
    const prev = writeQ[doc]||Promise.resolve();
    writeQ[doc]=prev.then(()=>S.db.doc("data/users/"+S.uid+"/"+doc).set(JSON.parse(JSON.stringify(data)))).catch(e=>{
      if(e&&e.code==="quota_exceeded") toast("Se llenó el espacio de guardado en la nube; tu avance queda en este navegador.");
    });
  },700);
}

async function initCapabilities(){
  const C = window.claude;
  if(!C||!C.use){S.sampleState="off";render();return}
  C.use("sample").then(s=>{S.sample=s;S.sampleState=s?"ready":"off";render()}).catch(()=>{S.sampleState="off";render()});
  try{
    const [user,db] = await Promise.all([C.use("user"),C.use("db")]);
    if(!user||!db) return;
    const uid = await user.id(); if(!uid) return;
    S.db=db; S.uid=uid;
    const snap = await db.collection("data/users/"+uid).get();
    const remote = {}; snap.docs.forEach(d=>{remote[d.id]=d.data()});
    if(remote.progreso){S.progreso=Object.assign({temas:{},qs:{},dias:{}},remote.progreso)} else persist("progreso");
    if(remote.fallos){S.fallos=Object.assign({items:{}},remote.fallos)} else persist("fallos");
    for(const id in remote) if(id.startsWith("banco_")&&remote[id]&&Array.isArray(remote[id].qs)) S.bancos[+id.slice(6)]=remote[id];
    for(const n in S.bancos) if(!remote["banco_"+n]) persist("banco_"+n);
    lsSet("progreso",S.progreso); lsSet("fallos",S.fallos);
    document.getElementById("syncState").textContent="Guardado en tu cuenta";
    render();
  }catch(e){/* sigue con almacenamiento local */}
}

/* ---------- Claude: generación ---------- */
function schemaText(){return `Responde SOLO con un arreglo JSON, sin texto antes ni después, con este formato exacto:
[{"p":"enunciado","o":["alternativa A","alternativa B","alternativa C","alternativa D","alternativa E"],"c":2,"ex":"por qué la correcta es correcta (2-4 oraciones)","d":["por qué se descarta A","por qué se descarta B","","por qué se descarta D","por qué se descarta E"],"nem":null,"perla":"1-2 datos fijos de alto rendimiento"}]
- "c" es el índice (0-4) de la correcta; en "d" la posición de la correcta va como cadena vacía y cada incorrecta explica por qué se descarta y a qué entidad o situación corresponde realmente.
- "nem": SOLO si existe una nemotecnia clásica ampliamente difundida en libros y manuales de medicina en español sobre ese punto exacto; escríbela en español, sin palabras en inglés. Si no existe o no estás seguro, pon null. Nunca inventes una nemotecnia.`}
function baseRules(t){return `Eres un médico docente peruano experto en preparar el examen de EsSalud (internado) y el ENAM.
Curso: ${t.curso}. Tema: ${t.tema}. Subtema: ${t.sub}.
Semáforo del subtema: ${COLOR_NAME[t.cs]} (${COLOR_DEPTH[t.cs]}).
Reglas:
- Alrededor de 70 % casos clínicos breves al estilo EsSalud 2021-2025; el resto preguntas directas. Prioriza diagnóstico, luego aspectos generales, luego tratamiento.
- 5 alternativas homogéneas (misma categoría) y todas plausibles. Incluye al menos 2 distractores trampa de los que más confunden: entidad vecina, dato verdadero de otra enfermedad parecida, conducta correcta pero en otro momento, cifra cercana o criterio desactualizado.
- Una sola respuesta correcta e indiscutible según guías vigentes; cuando aplique, usa las normas técnicas del MINSA del Perú.
- Varía la posición de la respuesta correcta.
- Todo en español (castellano).`}
function avoidList(n){const qs=questionsFor(n);return qs.length?"\nNo repitas ni parafrasees estas preguntas ya existentes:\n"+qs.slice(-25).map(q=>"- "+q.p.slice(0,140)).join("\n"):""}
function coerceQ(r){
  if(!r||typeof r!=="object") return null;
  const p=r.p||r.pregunta||r.enunciado||r.caso;
  let o=r.o||r.opciones||r.alternativas;
  if(o&&!Array.isArray(o)&&typeof o==="object") o=["A","B","C","D","E"].map(k=>o[k]??o[k.toLowerCase()]);
  if(Array.isArray(o)) o=o.map(x=>typeof x==="object"&&x?(x.texto||x.text||x.t||""):String(x??"")).map(x=>x.replace(/^\s*[A-Ea-e][\)\.\-:]\s+/,""));
  let c=r.c??r.correcta??r.respuesta;
  if(typeof c==="string"){const s=c.trim();c=/^[A-Ea-e]\b/.test(s)?"ABCDE".indexOf(s[0].toUpperCase()):parseInt(s,10)}
  let d=r.d||r.descartes||r.explicaciones;
  if(d&&!Array.isArray(d)&&typeof d==="object") d=["A","B","C","D","E"].map(k=>d[k]??d[k.toLowerCase()]??"");
  return {p,o,c,ex:r.ex||r.explicacion||r.explicación||"",d,nem:r.nem??r.nemotecnia??null,perla:r.perla||r.fija||""};
}
function parseQs(text){
  let s=String(text||"").replace(/```(?:json)?/gi,"").trim();
  const tries=[];
  const a=s.indexOf("["),b=s.lastIndexOf("]");if(a>=0&&b>a) tries.push(s.slice(a,b+1));
  const c=s.indexOf("{"),d=s.lastIndexOf("}");if(c>=0&&d>c) tries.push(s.slice(c,d+1));
  for(const t of tries){try{let v=JSON.parse(t);
    if(!Array.isArray(v)) v=Array.isArray(v.preguntas)?v.preguntas:(Object.values(v).find(Array.isArray)&&!v.o?Object.values(v).find(Array.isArray):[v]);
    const out=v.map(coerceQ).filter(validQ); if(out.length) return out;}catch(e){}}
  return [];
}
function validQ(q){return q&&typeof q.p==="string"&&q.p.length>10&&Array.isArray(q.o)&&q.o.length===5&&q.o.every(x=>x)&&Number.isInteger(q.c)&&q.c>=0&&q.c<5&&typeof q.ex==="string"}
function normQ(q,n,extra){const d=Array.isArray(q.d)&&q.d.length===5?q.d.map(x=>String(x||"")):["","","","",""];d[q.c]="";return Object.assign({id:"g"+n+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n,dif:byN.get(n).cs==="V"?"difícil":byN.get(n).cs==="A"?"intermedia":"datito",p:q.p,o:q.o.map(String),c:q.c,ex:q.ex,d,nem:(typeof q.nem==="string"&&q.nem.trim())?q.nem.trim():null,perla:q.perla?String(q.perla):""},extra||{})}
async function generate(n,{count=1,kind="normal",baseQ=null,chosen=null}={}){
  if(!S.sample) throw {code:"off"};
  const t=byN.get(n);
  let task;
  if(kind==="profundizar"){
    task=`Pregunta base que el estudiante acaba de resolver:\n${baseQ.p}\nAlternativas: ${baseQ.o.map((o,i)=>L(i)+") "+o).join(" | ")}\nCorrecta: ${L(baseQ.c)}.\nRedacta ${count} pregunta(s) NUEVA(S) más difícil(es) sobre el MISMO concepto, desde otro ángulo (otro caso clínico, el diagnóstico diferencial fino, la excepción, el siguiente paso o la complicación). Nivel especialista.`;
  }else if(kind==="similar"){
    task=`El estudiante FALLÓ esta pregunta:\n${baseQ.p}\nAlternativas: ${baseQ.o.map((o,i)=>L(i)+") "+o).join(" | ")}\nCorrecta: ${L(baseQ.c)}) ${baseQ.o[baseQ.c]}. Él eligió: ${L(chosen)}) ${baseQ.o[chosen]}.\nRedacta ${count} pregunta(s) NUEVA(S) que ataquen específicamente esa confusión (la diferencia clave entre lo que eligió y lo correcto), con casos distintos, para que no vuelva a fallar. Incluye entre las alternativas la entidad que eligió por error cuando sea pertinente.`;
  }else{
    task=`Redacta ${count} pregunta(s) NUEVA(S) sobre este subtema, del nivel que indica el semáforo, cubriendo aspectos distintos entre sí.`;
  }
  const prompt = baseRules(t)+"\n\n"+task+avoidList(n)+"\n\n"+schemaText();
  let r;
  try{ r = await S.sample(prompt,{modelTier:kind==="profundizar"?"complex":"default",cache:false}); }
  catch(e){ if(e&&e.text){const rescued=parseQs(e.text); if(rescued.length) r={text:e.text}; else throw e;} else throw e; }
  const arr=parseQs(r.text).map(q=>normQ(q,n,kind==="normal"?null:{origen:kind}));
  if(!arr.length) throw {code:r.truncated?"truncated":"formato"};
  if(!S.bancos[n]) S.bancos[n]={qs:[]};
  S.bancos[n].qs.push(...arr);
  if(S.bancos[n].qs.length>60) S.bancos[n].qs=S.bancos[n].qs.slice(-60);
  persist("banco_"+n);
  return arr;
}
function genErrorMsg(e){
  const c=e&&e.code;
  if(c==="off"||c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared") return "La generación con Claude no está disponible en esta vista. Puedes seguir con las preguntas guardadas.";
  if(c==="rate_limited") return "Se alcanzó el límite de uso por ahora. Intenta de nuevo en unos minutos.";
  if(c==="session_expired") return "Tu sesión expiró; vuelve a iniciar sesión en Claude.";
  if(c==="refused") return "Claude no quiso responder esa solicitud. Prueba con otra pregunta o subtema.";
  return "Claude no pudo generar la pregunta esta vez"+(c?" (código: "+c+")":"")+". Vuelve a intentarlo.";
}
function mdLite(s){
  const lines=esc(s).split(/\n/);let html="",inList=false;
  for(let ln of lines){ln=ln.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^\s*[-•*]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true}html+="<li>"+ln.replace(/^\s*[-•*]\s+/,"")+"</li>"}
    else{if(inList){html+="</ul>";inList=false} if(ln.trim()) html+="<p>"+ln.replace(/^#+\s*/,"")+"</p>"}}
  if(inList) html+="</ul>"; return html;
}

/* ---------- Sesiones ---------- */
function startSession(items,label){
  S.session={label,items:items.map(x=>Object.assign({q:null,state:"new"},x)),idx:0,used:new Set(),res:[]};
  location.hash="#practicar"; render(); resolveCurrent();
}
function sessionFromTemas(ns,label){
  const per=ns.map(n=>({n,k:targetCount(byN.get(n),S.mode)}));
  const items=[];let round=0,added=true;
  while(added){added=false;for(const p of per){if(round<p.k){items.push({n:p.n});added=true}}round++}
  if(!items.length){toast("No hay subtemas para practicar con ese filtro.");return}
  startSession(items,label);
}
function pickQ(n,used){
  const qs=questionsFor(n).filter(q=>!used.has(q.id));
  const never=qs.filter(q=>!S.progreso.qs[q.id]);
  const failed=qs.filter(q=>S.progreso.qs[q.id]&&!S.progreso.qs[q.id].ok);
  return never[0]||failed[0]||null;
}
async function resolveItem(it){
  if(it.q||it.state==="loading") return;
  if(it.qid){it.q=findQ(it.qid);if(it.q){S.session.used.add(it.q.id);return}}
  const s=S.session;
  if(it.gen){
    if(S.sampleState!=="ready"){it.state="noq";return}
    it.state="loading";
    try{const arr=await generate(it.n,Object.assign({count:1},it.gen));it.q=arr[0];s.used.add(arr[0].id);it.state="new"}
    catch(e){it.state="err";it.err=genErrorMsg(e)}
    return;
  }
  const q=pickQ(it.n,s.used);
  if(q){it.q=q;s.used.add(q.id);return}
  if(S.sampleState!=="ready"){it.state="noq";return}
  it.state="loading";
  try{
    const t=byN.get(it.n);
    const pending=s.items.filter(x=>x.n===it.n&&!x.q&&x!==it).length;
    const arr=await generate(it.n,{count:Math.min(2,1+pending,t.cs==="V"?2:1)});
    const nq=arr.find(q=>!s.used.has(q.id));it.q=nq;s.used.add(nq.id);it.state="new";
  }catch(e){it.state="err";it.err=genErrorMsg(e)}
}
async function resolveCurrent(){
  const s=S.session;if(!s)return;const it=s.items[s.idx];if(!it)return;
  const wasEmpty=!it.q; await resolveItem(it); if(S.session===s&&wasEmpty) renderPractice();
  const nx=s.items[s.idx+1]; if(nx&&!nx.q) resolveItem(nx);
}
function answer(i){
  const s=S.session,it=s.items[s.idx],q=it.q; if(it.chosen!=null) return;
  it.chosen=i; const ok=i===q.c;
  const prev=S.progreso.qs[q.id]||{k:0};
  S.progreso.qs[q.id]={ok,t:Date.now(),k:(prev.k||0)+1};
  const ts=Object.assign({e:"Pendiente",a:0,i:0},tstate(q.n)); ts.i++; if(ok) ts.a++;
  const target=targetCount(byN.get(q.n),"profundo");
  if(ts.i>=Math.min(target,3)){const acc=ts.a/ts.i; if(acc>=0.8&&ts.i>=target) ts.e="Banqueado ✔"; else if(acc<0.6) ts.e="Reforzar"; else if(ts.e==="Pendiente") ts.e="Leído";}
  S.progreso.temas[q.n]=ts;
  const d=todayISO(); const dd=S.progreso.dias[d]||{r:0,ok:0}; dd.r++; if(ok) dd.ok++; S.progreso.dias[d]=dd;
  persist("progreso");
  const f=S.fallos.items[q.id];
  if(!ok){S.fallos.items[q.id]={n:q.n,el:i,t:Date.now(),v:(f?f.v:0)+1,res:false};persist("fallos")}
  else if(f&&!f.res){f.res=true;f.tr=Date.now();persist("fallos")}
  s.res.push({id:q.id,n:q.n,ok});
  renderPractice(); updateHeader();
}
function next(){const s=S.session; s.idx++; renderPractice(); resolveCurrent(); window.scrollTo({top:0,behavior:"smooth"})}
async function deepen(kind){
  const s=S.session,it=s.items[s.idx],q=it.q;
  const k=kind==="profundizar"?1:3;
  const gen={kind,baseQ:q,chosen:it.chosen};
  s.items.splice(s.idx+1,0,...Array.from({length:k},()=>({n:q.n,q:null,state:"new",gen})));
  next();
}
function similarItems(x,k){return Array.from({length:k},()=>({n:x.n,gen:{kind:"similar",baseQ:x.q,chosen:x.el}}))}
async function askClaude(){
  const s=S.session,it=s.items[s.idx],q=it.q,t=byN.get(q.n);
  const ta=$("#askText"),out=$("#askOut"),btn=$("#askBtn");
  const user=ta.value.trim()||"Explícame más a fondo este punto, como para no volver a confundirme.";
  if(!S.sample){out.innerHTML='<p class="note warn">'+esc(genErrorMsg({code:"off"}))+'</p>';return}
  it.chat=it.chat||[];
  const ctx=`Eres un tutor médico peruano que prepara al estudiante para el examen de EsSalud. Responde en español, claro y breve (máximo 200 palabras), con viñetas si ayudan. Si citas una nemotecnia, que sea solo una clásica de libros en español; si no hay, no inventes.
Tema: ${t.curso} > ${t.tema} > ${t.sub} (semáforo ${COLOR_NAME[t.cs]}).
Pregunta: ${q.p}
Alternativas: ${q.o.map((o,i)=>L(i)+") "+o).join(" | ")}
Correcta: ${L(q.c)}. El estudiante eligió: ${L(it.chosen)}.
Explicación dada: ${q.ex}`;
  const msgs=[{role:"user",content:ctx+"\n\nDuda del estudiante: "+(it.chat.length?it.chat[0].u:user)}];
  it.chat.forEach((m,i)=>{if(i>0)msgs.push({role:"user",content:m.u});if(m.a)msgs.push({role:"assistant",content:m.a})});
  if(it.chat.length) msgs.push({role:"user",content:user});
  const turn={u:user,a:""};it.chat.push(turn);
  btn.disabled=true;ta.value="";
  const div=document.createElement("div");div.className="answer";div.innerHTML='<p><b>Tú:</b> '+esc(user)+'</p><div class="a">Pensando…</div>';out.appendChild(div);
  try{
    const r=await S.sample(msgs,{cache:false,onText:({text})=>{div.querySelector(".a").innerHTML=mdLite(text)}});
    turn.a=r.text;div.querySelector(".a").innerHTML=mdLite(r.text);
  }catch(e){it.chat.pop();div.querySelector(".a").innerHTML='<span class="note warn">'+esc(genErrorMsg(e))+'</span>'}
  btn.disabled=false;
}

  const porTema={};r.forEach(x=>{porTema[x.n]=porTema[x.n]||{a:0,i:0};porTema[x.n].i++;if(x.ok)porTema[x.n].a++});
  const rows=Object.entries(porTema).map(([n,v])=>{const t=byN.get(+n);const acc=v.a/v.i;
    const rec=acc>=0.8?(t.cs==="R"?"Listo: el datito está fijo. Avanza.":"Bien. Avanza; vuelve en la ronda 2."):acc>=0.5?"Repasa la fija y haz 2 preguntas más.":"Vuelve a la teoría en tu Libro7 y luego profundiza.";
    return `<div class="item"><span class="num">#${t.n}</span><div class="body"><div class="t">${esc(t.sub)}</div><div class="m"><span class="chip ${t.cs}">${COLOR_NAME[t.cs]}</span><span>${v.a}/${v.i} · ${esc(rec)}</span><span class="estado ${estadoCls(tstate(t.n).e)}">${esc(tstate(t.n).e)}</span></div></div><div class="act"><button class="btn sm" data-practice="${t.n}">Profundizar</button></div></div>`}).join("");
  $("#app").innerHTML=`<h2>Sesión terminada</h2><p class="sub">${esc(s.label)}</p>
  <div class="summary"><div class="stat"><small>Respondidas</small><b>${r.length}</b></div><div class="stat"><small>Aciertos</small><b>${ok}</b></div><div class="stat"><small>% acierto</small><b>${r.length?Math.round(100*ok/r.length):0}%</b></div></div>
  <div class="row" style="margin-bottom:14px"><a class="btn primary" href="#fallos">Ver mis fallos</a><button class="btn" id="newS">Nueva sesión</button><a class="btn ghost" href="#hoy">Plan del día</a></div>
  <div class="list">${rows||'<p class="empty">No respondiste preguntas en esta sesión.</p>'}</div>`;
  $("#newS").onclick=()=>{S.session=null;renderPractice()};
}
function renderFallos(){
  const items=Object.entries(S.fallos.items).map(([id,f])=>({id,...f,q:findQ(id)})).filter(x=>x.q).sort((a,b)=>b.t-a.t);
  const act=items.filter(x=>!x.res),sup=items.filter(x=>x.res);
  const byCurso={};act.forEach(x=>{const c=byN.get(x.n).curso;byCurso[c]=(byCurso[c]||0)+1});
  const card=x=>{const t=byN.get(x.n);return `<div class="item"><span class="num">${x.v}×</span><div class="body">
    <div class="t">${esc(x.q.p.length>220?x.q.p.slice(0,220)+"…":x.q.p)}</div>
    <div class="m"><span class="chip ${t.cs}">${COLOR_NAME[t.cs]}</span><span>${esc(t.curso)} · ${esc(t.sub.slice(0,70))}</span></div>
    <div class="m"><span style="color:var(--bad)">Elegiste: ${esc(x.q.o[x.el])}</span><span style="color:var(--ok)">Correcta: ${esc(x.q.o[x.q.c])}</span></div></div>
    <div class="act">${x.res?`<button class="btn sm ghost" data-retry="${x.id}">Repetir</button>`:`<button class="btn sm" data-retry="${x.id}">Reintentar</button><button class="btn sm primary" data-similar="${x.id}" ${S.sampleState==="ready"?"":"disabled"}>3 similares</button><button class="btn sm ghost" data-res="${x.id}">Ya la domino</button>`}</div></div>`};
  $("#app").innerHTML=`<h2>Mis fallos</h2>
  <p class="sub">Cada pregunta fallada queda aquí hasta que la aciertes en un reintento. Genera preguntas nuevas que atacan la confusión exacta que tuviste.</p>
  <div class="summary"><div class="stat"><small>Por superar</small><b>${act.length}</b></div><div class="stat"><small>Superadas</small><b>${sup.length}</b></div><div class="stat"><small>Curso con más fallos</small><b style="font-size:1rem">${esc(Object.entries(byCurso).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—")}</b></div></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn primary" id="retryAll" ${act.length?"":"disabled"}>Reintentar todos mis fallos</button>
    <button class="btn" id="genAll" ${act.length&&S.sampleState==="ready"?"":"disabled"}>Generar repaso de mis fallos</button>
  </div>
  <div id="genHost"></div>
  <h3 style="margin:10px 0 6px">Por superar</h3>
  <div class="list">${act.map(card).join("")||'<p class="empty">Todavía no hay fallos. Cuando falles una pregunta aparecerá aquí con tu respuesta y la correcta.</p>'}</div>
  ${sup.length?`<h3 style="margin:22px 0 6px">Superadas</h3><div class="list">${sup.slice(0,40).map(card).join("")}</div>`:""}`;
  $("#retryAll").onclick=()=>startSession(act.map(x=>({n:x.n,qid:x.id})),"Reintento de fallos");
  $("#genAll").onclick=()=>startSession(act.slice(0,8).flatMap(x=>similarItems(x,1)),"Repaso generado de mis fallos");
  document.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{const x=items.find(i=>i.id===b.dataset.retry);startSession([{n:x.n,qid:x.id}],"Reintento")});
  document.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{S.fallos.items[b.dataset.res].res=true;persist("fallos");renderFallos();updateHeader()});
  document.querySelectorAll("[data-similar]").forEach(b=>b.onclick=()=>{
    const x=items.find(i=>i.id===b.dataset.similar);startSession(similarItems(x,3),"Similares a un fallo");
  });
}
function renderProgreso(){
  const colors=["V","A","R"].map(c=>{const l=TEMAS.filter(t=>t.cs===c);return {c,tot:l.length,b:l.filter(t=>banked(t.n)).length,le:l.filter(t=>tstate(t.n).e==="Leído").length,rf:l.filter(t=>tstate(t.n).e==="Reforzar").length,pe:l.reduce((a,t)=>a+t.pe,0),pec:l.filter(t=>banked(t.n)).reduce((a,t)=>a+t.pe,0)}});
  const qs=Object.values(S.progreso.qs);const okN=qs.filter(x=>x.ok).length;
  const cursos=CURSOS.map(c=>{const l=TEMAS.filter(t=>t.curso===c);const a=l.reduce((s,t)=>s+tstate(t.n).a,0),i=l.reduce((s,t)=>s+tstate(t.n).i,0);return {c,tot:l.length,b:l.filter(t=>banked(t.n)).length,rf:l.filter(t=>tstate(t.n).e==="Reforzar").length,a,i,pe:l.reduce((s,t)=>s+t.pe,0)}}).sort((x,y)=>y.pe-x.pe);
  const dias=Object.entries(S.progreso.dias).sort().slice(-10);
  $("#app").innerHTML=`<h2>Progreso</h2><p class="sub">Un subtema pasa a <b>Banqueado ✔</b> cuando llegas a las preguntas sugeridas con 80 % o más de acierto; baja a <b>Reforzar</b> si cae por debajo de 60 %.</p>
  <div class="summary">
    <div class="stat"><small>Preguntas respondidas</small><b>${qs.length}</b></div>
    <div class="stat"><small>% acierto global</small><b>${qs.length?Math.round(100*okN/qs.length):0}%</b></div>
    <div class="stat"><small>Banco disponible</small><b>${SEED.length+Object.values(S.bancos).reduce((a,b)=>a+b.qs.length,0)}</b></div>
    <div class="stat"><small>Preg. esperadas cubiertas</small><b>${colors.reduce((a,c)=>a+c.pec,0).toFixed(1)}</b></div>
  </div>
  <h3 style="margin-top:18px">Por color del semáforo</h3>
  <div class="bars">${colors.map(c=>`<div class="bar"><span><span class="chip ${c.c}">${COLOR_NAME[c.c]}</span></span><span class="track" title="Verde oscuro: banqueado · claro: leído · rojo: reforzar"><i style="width:${100*c.b/c.tot}%;background:var(--verde)"></i><i style="width:${100*c.le/c.tot}%;background:var(--accent);opacity:.55"></i><i style="width:${100*c.rf/c.tot}%;background:var(--rojo)"></i></span><span class="v">${c.b}/${c.tot}</span></div>`).join("")}</div>
  <h3>Por curso</h3><p class="counter">Ordenado por preguntas esperadas en el examen.</p>
  <div class="tablewrap"><table><thead><tr><th>Curso</th><th>Preg. esp.</th><th>Banqueados</th><th>Reforzar</th><th>Aciertos</th><th></th></tr></thead><tbody>
  ${cursos.map(c=>`<tr><td>${esc(c.c)}</td><td class="n">${c.pe.toFixed(1)}</td><td class="n">${c.b}/${c.tot}</td><td class="n">${c.rf||""}</td><td class="n">${c.i?Math.round(100*c.a/c.i)+"% ("+c.i+")":"—"}</td><td><button class="btn sm ghost" data-curso="${esc(c.c)}">Ver</button></td></tr>`).join("")}
  </tbody></table></div>
  ${dias.length?`<h3 style="margin-top:20px">Últimos días</h3><div class="bars">${dias.map(([d,v])=>{const f=fmtDay(d);const mx=Math.max(...dias.map(x=>x[1].r));return `<div class="bar"><span>${f.dn} ${f.d}</span><span class="track"><i style="width:${100*v.ok/mx}%;background:var(--verde)"></i><i style="width:${100*(v.r-v.ok)/mx}%;background:var(--rojo)"></i></span><span class="v">${v.ok}/${v.r}</span></div>`}).join("")}</div>`:""}
  <div class="row" style="margin-top:24px"><button class="btn ghost sm" id="resetBtn">Reiniciar mi avance</button><span id="resetConfirm"></span></div>`;
  document.querySelectorAll("[data-curso]").forEach(b=>b.onclick=()=>{S.filt=Object.assign(S.filt,{curso:b.dataset.curso,q:"",color:"",estado:"",star:false,libro:false,limit:80});location.hash="#temario"});
  $("#resetBtn").onclick=()=>{$("#resetConfirm").innerHTML='<span class="counter">¿Borrar estados, respuestas y fallos? (el banco de preguntas se conserva)</span> <button class="btn sm" id="resetYes" style="color:var(--bad)">Sí, reiniciar</button>';
    $("#resetYes").onclick=()=>{S.progreso={temas:{},qs:{},dias:{}};S.fallos={items:{}};persist("progreso");persist("fallos");toast("Avance reiniciado");render()}};
}
function openTema(n){
  const t=byN.get(n),st=tstate(n),url=libroURL(t.libro),nq=questionsFor(n).length;
  const kw=keyword(t);
  $("#drawerHost").innerHTML=`<div class="drawer" id="drawer"><div class="panel" role="dialog" aria-modal="true" aria-label="Detalle del subtema">
    <button class="btn sm ghost close" id="closeD">Cerrar</button>
    <div class="m row"><span class="chip ${t.cs}">${COLOR_NAME[t.cs]}</span>${stars(t.e25)}<span class="counter">#${t.n} · ${esc(t.area)} · ${esc(t.curso)}</span></div>
    <h2 style="font-size:1.3rem">${esc(t.sub)}</h2>
    <p class="sub" style="margin:0">${esc(t.tema)} · ${esc(COLOR_DEPTH[t.cs])}</p>
    <div class="summary" style="margin:0">
      <div class="stat"><small>Preg. esperadas</small><b>${t.pe.toFixed(2)}</b></div>
      <div class="stat"><small>Repaso</small><b>${t.min||"—"} min</b></div>
      <div class="stat"><small>Banqueo sugerido</small><b>${t.pb||"—"}</b></div>
      <div class="stat"><small>Aciertos</small><b>${st.a}/${st.i}</b></div>
    </div>
    <div class="steps">
      <div class="step ${st.e!=="Pendiente"?"done":""}"><span class="k">1</span><div><b>Lee en tu Libro7</b><br>${url?`<a class="btn sm" href="${url}" target="_blank" rel="noopener" style="margin-top:6px">Abrir ${esc(t.libro)}</a> <span class="counter">Busca con <kbd>Ctrl</kbd>+<kbd>F</kbd>: «${esc(kw)}»</span> <button class="btn sm ghost" id="copyKw">Copiar</button>`:`<span class="counter">${esc(t.enlibro||"Sin manual")}: no tienes Libro7 de este curso; usa las fijas de abajo y el esquema de la academia.</span>`}
        <div class="row" style="margin-top:8px"><button class="btn sm" id="markRead">${st.e==="Pendiente"?"Marcar como leído":"Leído ✓"}</button></div></div></div>
      <div class="step ${banked(n)?"done":""}"><span class="k">2</span><div><b>Banquea</b><br><span class="counter">${nq} preguntas en tu banco para este subtema${S.sampleState==="ready"?"; Claude genera más cuando se acaben":""}.</span>
        <div class="row" style="margin-top:8px"><button class="btn sm primary" id="pTema">Practicar este subtema</button></div></div></div>
    </div>
    <div><b>Estado</b><div class="toggles" style="margin-top:6px">${ESTADOS.map(e=>`<button class="tg" data-est="${esc(e)}" aria-pressed="${st.e===e}">${esc(e)}</button>`).join("")}</div></div>
    <div><div class="row" style="justify-content:space-between"><b>Fijas relámpago</b><button class="btn sm" id="fijasBtn" ${S.sampleState==="ready"?"":"disabled"}>${t.cs==="V"?"Resumen a profundidad":t.cs==="A"?"Datos clave":"El datito"}</button></div>
      <div id="fijasOut" class="counter" style="margin-top:6px">${S.sampleState==="ready"?"Claude resume lo que más se pregunta, según el color del semáforo.":"Disponible al abrir la app desde claude.ai."}</div></div>
  </div></div>`;
  const close=()=>{$("#drawerHost").innerHTML="";render()};
  $("#closeD").onclick=close; $("#drawer").onclick=e=>{if(e.target.id==="drawer")close()};
  $("#markRead").onclick=()=>{if(tstate(n).e==="Pendiente")setEstado(n,"Leído");openTema(n)};
  $("#copyKw")&&($("#copyKw").onclick=()=>{navigator.clipboard.writeText(kw).then(()=>toast("Copiado: "+kw)).catch(()=>toast("Busca: "+kw))});
  $("#pTema").onclick=()=>{$("#drawerHost").innerHTML="";sessionFromTemas([n],t.sub.slice(0,60))};
  document.querySelectorAll("[data-est]").forEach(b=>b.onclick=()=>{setEstado(n,b.dataset.est);openTema(n)});
  $("#fijasBtn").onclick=async()=>{
    const out=$("#fijasOut");out.className="answer";out.innerHTML="Pensando…";$("#fijasBtn").disabled=true;
    const len=t.cs==="V"?"10-14 viñetas organizadas por definición, fisiopatología, clínica, diagnóstico y tratamiento":t.cs==="A"?"6-8 viñetas con los datos clave":"2-3 viñetas: solo el datito que más se pregunta";
    const prompt=`Eres un médico docente peruano que prepara el examen de EsSalud. Escribe las fijas de examen de: ${t.curso} > ${t.tema} > ${t.sub}. Semáforo ${COLOR_NAME[t.cs]}: ${COLOR_DEPTH[t.cs]}. Formato: ${len}, con **negritas** en el dato clave. Usa normas del MINSA del Perú cuando aplique. Al final, solo si existe una nemotecnia clásica difundida en libros en español para este punto, agrégala en una línea que empiece con 'Nemotecnia clásica:'; si no existe, no pongas ninguna y no inventes. Todo en español, sin palabras en inglés.`;
    try{const r=await S.sample(prompt,{onText:({text})=>{out.innerHTML=mdLite(text)}});out.innerHTML=mdLite(r.text)}catch(e){out.innerHTML='<span class="note warn">'+esc(genErrorMsg(e))+'</span>'}
    const b=$("#fijasBtn");if(b)b.disabled=false;
  };
}
function bindModes(){document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;savePrefs();document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===S.mode))})}

/* ---------- Eventos globales ---------- */
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-practice]"); if(p){const n=+p.dataset.practice;sessionFromTemas([n],byN.get(n).sub.slice(0,60));return}
  const o=e.target.closest("[data-open]"); if(o){openTema(+o.dataset.open);return}
  const d=e.target.closest("[data-day]"); if(d){S.day=d.dataset.day;savePrefs();renderHoy();bindModes();return}
});
document.addEventListener("keydown",e=>{
  if(route()!=="practicar"||!S.session||e.target.matches("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey) return;
  const it=S.session.items[S.session.idx]; if(!it||!it.q) return;
  const k=e.key.toUpperCase();
  if(it.chosen==null&&"ABCDE".includes(k)&&k.length===1){answer(it.perm["ABCDE".indexOf(k)]);e.preventDefault()}
  else if(it.chosen!=null&&e.key==="Enter"&&!e.target.matches("button,a")){next();e.preventDefault()}
});
window.addEventListener("hashchange",()=>{render();if(route()==="hoy")bindModes()});
loadLocal(); render(); bindModes(); initCapabilities();
</script>

</body></html>
